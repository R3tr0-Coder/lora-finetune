[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lora-finetune"
version = "1.0.0"
description = "LoRA / QLoRA fine-tuning of open-source LLMs with PEFT + TRL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ryan Cheah"}]
keywords = ["llm", "lora", "peft", "fine-tuning", "qlora", "transformers", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage   = "https://github.com/R3tr0-Coder/lora-finetune"
Repository = "https://github.com/R3tr0-Coder/lora-finetune"

[tool.pytest.ini_options]
testpaths   = ["tests"]
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where   = ["."]
include = ["src*"]
